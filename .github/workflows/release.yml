name: Release

# Opt-in with the repo variable RELEASE_ENABLED=true.
# release-please keeps a release PR open on main. Merging it tags vX.Y.Z, publishes the GitHub Release,
# bumps <Version>, opens the back-merge PR into develop, then deploys production (if DEPLOY_ENABLED=true).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  deployments: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    uses: Gurren-Software/ci-workflows/.github/workflows/release.yml@v1
    with:
      sync-branch: develop
    secrets: inherit

  deploy-production:
    needs: release
    if: needs.release.outputs.release_created == 'true' && vars.DEPLOY_ENABLED == 'true'
    uses: Gurren-Software/ci-workflows/.github/workflows/coolify-deploy.yml@v1
    with:
      environment: production
    secrets: inherit
