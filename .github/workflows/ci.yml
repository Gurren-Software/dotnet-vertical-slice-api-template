name: CI

# Thin caller: the logic lives in Gurren-Software/ci-workflows (pinned to @v1).
# Everything optional is opt-in through repo settings, see the ci-workflows README:
#   secrets   DISCORD_WEBHOOK_URL, DISCORD_USER_ID, CLAUDE_CODE_OAUTH_TOKEN, SONAR_TOKEN, SONAR_HOST_URL,
#             COOLIFY_TOKEN, COOLIFY_BASE_URL, COOLIFY_APP_UUID_DEV, COOLIFY_APP_UUID_PROD
#   variables SONAR_PROJECT_KEY, DEPLOY_ENABLED=true, DEV_URL, PROD_URL
# Deploys: develop → dev (here, automatic). Production: release.yml (on release) or deploy.yml (button).

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  deployments: write

jobs:
  ci:
    uses: Gurren-Software/ci-workflows/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: VerticalSlice.slnx
      dockerfile: src/VerticalSlice.Api/Dockerfile
      ef-project: src/VerticalSlice.Api
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit

  review:
    needs: ci
    if: github.event_name == 'pull_request'
    uses: Gurren-Software/ci-workflows/.github/workflows/claude-review.yml@v1
    secrets: inherit

  deploy-dev:
    needs: ci
    if: github.event_name == 'push' && github.ref_name == 'develop' && vars.DEPLOY_ENABLED == 'true'
    uses: Gurren-Software/ci-workflows/.github/workflows/coolify-deploy.yml@v1
    with:
      environment: dev
    secrets: inherit
