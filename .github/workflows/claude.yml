name: Claude

# @claude in an issue, PR comment or review. Org members and collaborators only.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: Gurren-Software/ci-workflows/.github/workflows/claude-assistant.yml@v1
    secrets: inherit
