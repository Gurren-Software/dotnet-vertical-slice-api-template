name: Deploy

# Manual deploy button: Actions → Deploy → Run workflow.
# Coolify deploys the head of the branch configured on the app (dev → develop, production → main).
# Production only runs from main. To roll back, use Coolify's rollback or revert on main and release again.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target
        type: choice
        options: [dev, production]
        default: dev

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: inputs.environment != 'production' || github.ref_name == 'main'
    uses: Gurren-Software/ci-workflows/.github/workflows/coolify-deploy.yml@v1
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  wrong-branch:
    if: inputs.environment == 'production' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Production deploys only run from main. Pick 'main' in 'Use workflow from'."
          exit 1
